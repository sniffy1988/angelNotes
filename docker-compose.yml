services:
  bot:
    image: ghcr.io/sniffy1988/angelnotes-bot:latest
    container_name: angelnotes-bot
    env_file: .env
    environment:
      DB_PATH: /app/data/bot.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  adminer:
    build: ./adminer
    image: angelnotes-adminer:local
    container_name: angelnotes-adminer
    user: "0:0"
    ports:
      - "8888:8080"
    volumes:
      - ./data:/db
    restart: unless-stopped
