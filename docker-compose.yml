services:
  bot:
    image: ghcr.io/sniffy1988/angelnotes-bot:latest
    container_name: angelnotes-bot
    env_file: .env
    environment:
      DB_PATH: /app/data/bot.db
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-120}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  dbweb:
    image: ghcr.io/coleifer/sqlite-web:latest
    container_name: angelnotes-dbweb
    user: "0:0"
    ports:
      - "8888:8080"
    volumes:
      - ./data:/data
    command: ["bot.db", "--host", "0.0.0.0", "--port", "8080"]
    restart: unless-stopped
